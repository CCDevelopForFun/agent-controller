apiVersion: agent-controller.dev/v1alpha1
kind: Agent
metadata:
  name: mcp-stdio-agent
spec:
  model:
    provider: anthropic
    name: claude-sonnet-4-20250514
  task: |
    What time is it?
  tools: []
  mcpServers:
    - name: time-server
      transport: stdio
      command: npx
      args: ["-y", "@modelcontextprotocol/server-time"]
      lifecycle: eager
  runtime:
    type: local
