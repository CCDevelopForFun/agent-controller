apiVersion: agent-controller.dev/v1alpha1
kind: Tool
metadata:
  name: get_time
  version: 0.1.0
  owner: agent-controller
  description: Returns current UTC time as ISO-8601 string
spec:
  entrypoint: ./entrypoint.ts
  inputSchema: {}
  outputSchema:
    type: object
    properties:
      time:
        type: string
        format: date-time
  riskLevel: low
  requiredPermissions: []
  supportsDryRun: false
